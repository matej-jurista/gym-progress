<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gym Progress</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--card:#151c2f;--card2:#1b2440;--ink:#f5f7ff;--muted:#9da9c7;--line:#2c3858;--accent:#75e1ad;--accent2:#7ab8ff;--danger:#ff7f8f;--shadow:0 10px 30px #0005}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(160deg,#0b1020,#101a30 60%,#0b1020);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;min-height:100vh}
    button,input,select{font:inherit} button{cursor:pointer}.shell{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}h1{font-size:24px;margin:0}.tagline{font-size:12px;color:var(--muted);margin-top:4px}.pill{padding:7px 10px;border-radius:999px;background:#18243a;color:var(--accent);font-size:12px;border:1px solid #294366}
    .tabs{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0d1425ee;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.tabs button{max-width:190px;flex:1;border:0;background:none;color:var(--muted);padding:9px 4px;border-radius:12px;font-size:12px}.tabs button.active{background:#1d2943;color:var(--ink)}
    .view{display:none}.view.active{display:block}.card{background:linear-gradient(145deg,var(--card),#11192b);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.hero{background:linear-gradient(135deg,#18334a,#17243d 55%,#18302a)}
    h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}.muted{color:var(--muted)}.tiny{font-size:12px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}.stack{display:grid;gap:10px}
    .btn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:11px 14px}.btn.primary{background:var(--accent);color:#082116;border-color:transparent;font-weight:750}.btn.secondary{background:#1b3454;color:#dcecff}.btn.danger{color:#ffdce1;border-color:#673040;background:#371c29}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.38;cursor:not-allowed}
    select,input{width:100%;background:#0e1628;border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:11px}label{font-size:12px;color:var(--muted);display:grid;gap:5px}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .workout-option{padding:13px;border-radius:14px;border:1px solid var(--line);background:#111a2d}.workout-option.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.workout-option button{width:100%;text-align:left;border:0;background:none;color:inherit;padding:0}.exercise{padding:0;overflow:hidden}.exercise-head{padding:14px 14px 10px}.exercise-meta{font-size:12px;color:var(--accent2);margin-top:4px}.measure-control{display:flex;align-items:center;gap:7px;margin-top:8px}.measure-control span{font-size:11px;color:var(--muted)}.measure-control select{width:auto;min-width:160px;padding:7px 9px;font-size:12px}.recommend{font-size:12px;background:#112b2a;color:#bff4d7;padding:9px 12px;border-top:1px solid #23514a}.set-head,.set-row{display:grid;grid-template-columns:32px 1fr 1fr 60px 42px;gap:7px;align-items:center;padding:5px 14px}.set-head.simple,.set-row.simple{grid-template-columns:32px 1fr 60px 42px}.set-head{font-size:11px;color:var(--muted)}.set-row input{padding:9px 6px;text-align:center}.set-row .done{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0e1628;color:transparent}.set-row .done.checked{background:var(--accent);color:#082116}.exercise-actions{padding:10px 14px 14px;display:flex;gap:8px}.superset{display:inline-flex;background:#272657;color:#c9c8ff;border-radius:7px;padding:3px 7px;font-size:10px;margin-left:5px}
    .modal{position:fixed;z-index:50;inset:0;background:#050811d9;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:min(760px,100%);max-height:88vh;overflow:auto;background:#121b2d;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.suggestion{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
    .history-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}.history-actions{display:grid;gap:6px}.datebox{background:#1b2942;border-radius:11px;text-align:center;padding:7px;min-width:52px}.datebox b{display:block;font-size:17px}.history-lines{font-size:12px;color:var(--muted);line-height:1.5}.edit-exercise{border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden;background:#0e1628}.edit-exercise-head{padding:12px}.edit-set-actions{padding:10px 14px 14px;display:flex;gap:8px}.chart-wrap{height:230px;position:relative}canvas{width:100%;height:100%}.empty{text-align:center;color:var(--muted);padding:30px 12px}.notice{padding:10px 12px;background:#372f16;color:#ffe6a3;border:1px solid #695926;border-radius:12px;font-size:12px}.toast{position:fixed;z-index:80;left:50%;bottom:85px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#f4f7ff;color:#101522;padding:10px 15px;border-radius:999px;pointer-events:none;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:650px){.tabs{left:50%;transform:translateX(-50%);max-width:540px;border:1px solid var(--line);border-radius:18px 18px 0 0}.sheet{border-radius:22px;margin-bottom:20px}.modal{align-items:flex-end}}
  </style>
</head>
<body>
<main class="shell">
  <header><div><h1>Gym Progress</h1><div class="tagline">Funkčná sila • padel • bicykel • turistika</div></div><div class="pill" id="phasePill">Týždeň 1</div></header>
  <section id="today" class="view active"></section>
  <section id="history" class="view"></section>
  <section id="charts" class="view"></section>
  <section id="data" class="view"></section>
</main>
<nav class="tabs" aria-label="Navigácia">
  <button class="active" data-view="today">●<br>Tréning</button><button data-view="history">◷<br>História</button><button data-view="charts">↗<br>Grafy</button><button data-view="data">⇅<br>Dáta</button>
</nav>
<div class="modal" id="swapModal"><div class="sheet" id="swapSheet"></div></div>
<div class="modal" id="editModal"><div class="sheet" id="editSheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const PLANS={
 upperA:{name:'Upper A',focus:'Sila tlaku + vyvážený chrbát',exercises:[
  e('bench','Bench press',4,'4–6','bench',['DB bench press','Machine chest press','Floor press']),
  e('pulldown','Lat pulldown / zhyby',3,'6–8','vertical-pull',['Zhyby s dopomocou','Neutral-grip pulldown','Single-arm pulldown']),
  e('incline-db','Incline DB press',3,'8–10','incline-press',['Incline machine press','Incline barbell bench','Low-to-high cable press']),
  e('cable-row','Seated cable row',3,'8–12','horizontal-pull',['Neutral seated cable row','One-arm cable row','Machine row']),
  e('lateral','Lateral raise',3,'12–15','lateral','A',['Cable lateral raise','Machine lateral raise','Lean-away lateral raise']),
  e('pushdown','Rope pushdown',3,'10–12','triceps','A',['Straight-bar pushdown','Single-arm cable pushdown','Close-grip push-up']),
  e('ezcurl','EZ-bar curl',3,'8–12','biceps','B',['DB curl','Cable curl','Preacher curl']),
  e('crunch','Cable crunch',3,'10–15','core-flex','B',['Machine crunch','Weighted crunch','Decline crunch']),
  e('pallof','Pallof press',2,'10–12/strana','core-anti','C',['Cable hold','Dead bug','Bird dog']),
  e('reverse-crunch','Reverse crunch',2,'12–15','core-flex','C',['Hanging knee raise','Lying leg raise','Toe tap'])]},
 lower:{name:'Lower',focus:'Hamstringy + sila pre kopce a zmeny smeru',exercises:[
  e('squat','Back squat',4,'4–6','squat',['Front squat','Hack squat','Leg press']),
  e('rdl','Romanian deadlift',4,'6–8','hinge',['DB Romanian deadlift','Trap-bar deadlift','Cable pull-through']),
  e('split-squat','Bulgarian split squat',3,'8–10/strana','single-leg',['Reverse lunge','Step-up','Walking lunge']),
  e('leg-curl','Seated / lying leg curl',3,'10–12','knee-flex',['Nordic curl s dopomocou','Stability-ball leg curl','Single-leg curl']),
  e('calf','Standing calf raise',3,'12–15','calves','A',['Seated calf raise','Leg-press calf raise','Single-leg calf raise']),
  e('crunch-l','Cable crunch',3,'10–15','core-flex','A',['Machine crunch','Weighted crunch','Decline crunch']),
  e('pallof-l','Pallof press',2,'10–12/strana','core-anti','B',['Cable hold','Dead bug','Bird dog']),
  e('reverse-l','Reverse crunch',2,'12–15','core-flex','B',['Hanging knee raise','Lying leg raise','Toe tap'])]},
 upperB:{name:'Upper B',focus:'Ťahová sila + ramená a horný hrudník',exercises:[
  e('pulldown-b','Lat pulldown / zhyby',4,'5–8','vertical-pull',['Zhyby s dopomocou','Neutral-grip pulldown','Single-arm pulldown']),
  e('incline-bb','Incline barbell bench',3,'6–8','incline-press',['Incline DB press','Incline machine press','Low-to-high cable press']),
  e('neutral-row','Neutral seated cable row',3,'8–10','horizontal-pull',['One-arm cable row','Machine row','Wide-grip cable row']),
  e('db-shoulder','Seated DB shoulder press',3,'8–10','shoulder-press',['Machine shoulder press','Landmine press','Arnold press']),
  e('reverse-pec','Reverse pec deck',3,'12–15','rear-delt','A',['Face pull','Cable rear-delt fly','Bent-over DB raise']),
  e('hammer','Hammer curl',3,'8–12','biceps','A',['Rope hammer curl','Incline DB curl','EZ-bar curl']),
  e('pushdown-b','Rope pushdown',3,'10–12','triceps','B',['Straight-bar pushdown','Single-arm cable pushdown','Close-grip push-up']),
  e('crunch-b','Cable crunch',3,'10–15','core-flex','B',['Machine crunch','Weighted crunch','Decline crunch']),
  e('pallof-b','Pallof press',2,'10–12/strana','core-anti','C',['Cable hold','Dead bug','Bird dog']),
  e('reverse-b','Reverse crunch',2,'12–15','core-flex','C',['Hanging knee raise','Lying leg raise','Toe tap'])]}
};
function e(id,name,sets,reps,movement,superset,suggestions){if(Array.isArray(superset)){suggestions=superset;superset=''}return{id,name,sets,reps,movement,superset:superset||'',suggestions:suggestions||[]}}
const KEY='gymProgressV5';
let state=load(),draft=null,activeSwap=null,editDraft=null;
function load(){
 try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version)return normalizeState(x)}catch{}
 try{const old=JSON.parse(localStorage.getItem('gym-progress-v4'));if(old&&old.sessions)return normalizeState(migrateV4(old))}catch{}
 return normalizeState({version:6,createdAt:new Date().toISOString(),sessions:[],replacements:{},measureModes:{},cycleStart:todayISO(),selectedPlan:'upperA'})
}
function migrateV4(old){
 const dayMap={monday:['upperA','Upper A'],friday:['upperB','Upper B'],lower:['lower','Lower']};
 const sessions=Object.values(old.sessions||{}).map((s,i)=>{
  const mapped=dayMap[s.day]||['upperA',s.day||'Tréning'];
  return{id:'v4-'+(s.date||'date')+'-'+i,date:s.date||todayISO(),planKey:mapped[0],planName:mapped[1],migratedFromV4:true,exercises:Object.entries(s.entries||{}).map(([id,x])=>({exerciseId:'v4-'+id,name:x.name||'Cvik',originalId:'v4-'+id,target:'Import z v4',movement:x.group||'legacy',superset:'',sets:(x.sets||[]).map(v=>({weight:v.weight??'',reps:v.reps??'',done:v.weight!==''||v.reps!==''}))}))}
 }).filter(s=>s.exercises.some(x=>x.sets.some(v=>v.done)));
 const weeks=Math.max(0,(Number(old.week)||1)-1),start=new Date();start.setDate(start.getDate()-weeks*7);
 return{version:6,createdAt:new Date().toISOString(),migratedAt:new Date().toISOString(),sessions,replacements:{},measureModes:{},cycleStart:start.toISOString().slice(0,10),selectedPlan:dayMap[old.day]?.[0]||'upperA'}
}
function defaultMeasure(x){const name=(x?.name||'').toLowerCase();if(/plank|wall sit|výdrž| hold/.test(name))return'time';if(/reverse crunch|hanging knee|hanging leg|lying leg|dead bug|bird dog|toe tap|push-up|push up/.test(name))return'bodyweight';return'weight'}
function normalizeSet(v={}){return{weight:v.weight??'',reps:v.reps??'',seconds:v.seconds??'',rir:v.rir??'',done:!!v.done}}
function inferMeasure(x){if(['weight','bodyweight','time'].includes(x?.measure))return x.measure;if((x?.sets||[]).some(v=>v.seconds!==''&&v.seconds!=null))return'time';if((x?.sets||[]).some(v=>v.weight!==''&&v.weight!=null&&Number(v.weight)>0))return'weight';return defaultMeasure(x)}
function normalizeState(s){s.version=6;s.schemaVersion=2;s.sessions=Array.isArray(s.sessions)?s.sessions:[];s.replacements=s.replacements||{};s.measureModes=s.measureModes||{};s.selectedPlan=s.selectedPlan||'upperA';s.cycleStart=s.cycleStart||todayISO();s.sessions=s.sessions.map(session=>({...session,exercises:(session.exercises||[]).map(x=>{const measure=inferMeasure(x);return{...x,measure,sets:(x.sets||[]).map(normalizeSet)}})}));return s}
function save(){state.version=6;state.schemaVersion=2;localStorage.setItem(KEY,JSON.stringify(state))}
function todayISO(){return new Date().toISOString().slice(0,10)}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function actualExercise(planKey,base){const r=state.replacements[planKey+'|'+base.id];return r?{...base,id:r.id,name:r.name,originalId:base.id,suggestions:base.suggestions}:base}
function phase(){const days=Math.max(0,Math.floor((new Date(todayISO())-new Date(state.cycleStart))/86400000)),week=Math.floor(days/7)%4+1;return[{week:1,name:'Základ',hint:'Nechaj 2–3 opakovania v rezerve.'},{week:2,name:'Budovanie',hint:'Pridaj opakovanie alebo malú váhu.'},{week:3,name:'Intenzita',hint:'Nechaj 1–2 opakovania v rezerve.'},{week:4,name:'Deload',hint:'Uber 10–15 % váhy alebo 1 sériu.'}][week-1]}
function lastFor(exId){return [...state.sessions].reverse().flatMap(s=>s.exercises||[]).find(x=>x.exerciseId===exId)}
function fmt(n){if(n===''||n==null)return'';return Number(n).toLocaleString('sk-SK',{maximumFractionDigits:2})}
function measureLabel(mode){return mode==='bodyweight'?'Vlastná váha':mode==='time'?'Čas':'Váha + opakovania'}
function formatSet(s,mode){let out=mode==='time'?`${s.seconds||'—'} s`:mode==='bodyweight'?`${s.reps||'—'} op.`:`${fmt(s.weight)||'—'} kg × ${s.reps||'—'}`;if(s.rir!==''&&s.rir!=null)out+=` · RIR ${s.rir}`;return out}
function recommendation(ex){const last=lastFor(ex.id),p=phase(),mode=ex.measure||last?.measure||defaultMeasure(ex);if(!last)return mode==='time'?'Začni konzervatívnou výdržou a drž čistú techniku.':mode==='bodyweight'?'Začni v plánovanom rozsahu opakovaní s čistou technikou.':'Začni konzervatívne; prvá séria určí pracovnú váhu.';const done=last.sets.filter(s=>s.done);if(!done.length)return'Posledný tréning nemá dokončené série.';if(mode==='time'){const vals=done.map(s=>Number(s.seconds)).filter(Boolean);return vals.length?`Minule maximum: ${Math.max(...vals)} s • pridaj čas iba pri čistej technike.`:'Minulý tréning nemá zapísaný čas.'}if(mode==='bodyweight'){const vals=done.map(s=>Number(s.reps)).filter(Boolean);return vals.length?`Minule maximum: ${Math.max(...vals)} op. • ${p.hint}`:'Minulý tréning nemá zapísané opakovania.'}const weighted=done.filter(s=>s.weight!==''&&s.reps!=='');if(!weighted.length)return'Posledný tréning nemá dokončené série s váhou.';const avg=weighted.reduce((a,s)=>a+Number(s.weight),0)/weighted.length,reps=weighted.map(s=>Number(s.reps)),target=Number((ex.reps.match(/\d+/g)||[8]).slice(-1)[0]),atLimit=weighted.some(s=>s.rir!==''&&Number(s.rir)<1);let w=avg;if(p.week===4)w=avg*.875;else if(Math.min(...reps)>=target&&!atLimit)w=avg+.25;return`Odporúčanie: ${fmt(Math.round(w*4)/4)} kg${atLimit?' • RIR 0, váhu zatiaľ drž':' • '+p.hint}`}
function startDraft(planKey){const p=PLANS[planKey];draft={id:uid(),date:todayISO(),planKey,planName:p.name,startedAt:new Date().toISOString(),exercises:p.exercises.map(b=>{const x=actualExercise(planKey,b),last=lastFor(x.id),measure=state.measureModes[x.id]||last?.measure||defaultMeasure(x);return{exerciseId:x.id,name:x.name,originalId:x.originalId||b.id,target:`${x.sets} × ${x.reps}`,plannedSets:x.sets,movement:x.movement,superset:x.superset,measure,sets:Array.from({length:x.sets},(_,i)=>({...normalizeSet(last?.sets?.[i]),done:false}))}})};renderToday()}
function renderToday(){const root=document.querySelector('#today'),p=phase();document.querySelector('#phasePill').textContent=`Týždeň ${p.week} • ${p.name}`;if(!draft){root.innerHTML=`<div class="card hero"><div class="muted tiny">DNES • ${new Date().toLocaleDateString('sk-SK',{weekday:'long',day:'numeric',month:'long'})}</div><h2 style="margin-top:7px">Vyber tréning</h2><div class="stack">${Object.entries(PLANS).map(([k,v])=>`<div class="workout-option ${state.selectedPlan===k?'selected':''}"><button onclick="selectPlan('${k}')"><b>${v.name}</b><div class="muted tiny">${v.focus} • ${v.exercises.length} cvikov</div></button></div>`).join('')}</div><button class="btn primary" style="width:100%;margin-top:14px" onclick="startDraft(state.selectedPlan)">Začať tréning</button><div class="tiny muted" style="margin-top:10px">${p.hint}</div></div><div class="card"><h3>Plán týždňa</h3><p class="muted tiny">Upper A → Lower → Upper B. Medzi silovými dňami si podľa únavy nechaj aspoň deň na padel, bicykel, ľahkú turistiku alebo regeneráciu.</p></div>`;return}
 root.innerHTML=`<div class="row between" style="margin-bottom:12px"><div><div class="tiny muted">${draft.date}</div><h2 style="margin:2px 0">${draft.planName}</h2></div><button class="btn small danger" onclick="cancelDraft()">Zrušiť</button></div>${draft.exercises.map((x,xi)=>exerciseHTML(x,xi)).join('')}<button class="btn primary" style="width:100%;padding:14px" onclick="finishWorkout()">Uložiť tréning</button>`}
function restFor(x){if(x.superset)return'Prestávka: 0–20 s medzi cvikmi • 60–90 s po dvojici';if(['bench','squat','hinge'].includes(x.movement))return'Prestávka: 2,5–3 min';if(['vertical-pull','incline-press','horizontal-pull','shoulder-press','single-leg'].includes(x.movement))return'Prestávka: 90–120 s';if(['core-flex','core-anti'].includes(x.movement))return'Prestávka: 45–75 s';return'Prestávka: 60–90 s'}
function measureOptions(current){return[['weight','Váha + opakovania'],['bodyweight','Vlastná váha'],['time','Čas (sekundy)']].map(([v,n])=>`<option value="${v}" ${current===v?'selected':''}>${n}</option>`).join('')}
function setRowsHTML(x,xi){const simple=x.measure!=='weight',head=x.measure==='time'?'sek.':x.measure==='bodyweight'?'op.':'kg';return`<div class="set-head ${simple?'simple':''}"><span>#</span><span>${head}</span>${simple?'':'<span>op.</span>'}<span>RIR</span><span>✓</span></div>${x.sets.map((s,si)=>`<div class="set-row ${simple?'simple':''}"><b>${si+1}</b>${x.measure==='time'?`<input aria-label="Sekundy ${esc(x.name)} séria ${si+1}" type="number" inputmode="numeric" step="1" min="0" value="${esc(s.seconds)}" oninput="setVal(${xi},${si},'seconds',this.value)">`:x.measure==='bodyweight'?`<input aria-label="Opakovania ${esc(x.name)} séria ${si+1}" type="number" inputmode="numeric" step="1" min="0" value="${esc(s.reps)}" oninput="setVal(${xi},${si},'reps',this.value)">`:`<input aria-label="Váha ${esc(x.name)} séria ${si+1}" type="number" inputmode="decimal" step="0.25" min="0" value="${esc(s.weight)}" oninput="setVal(${xi},${si},'weight',this.value)"><input aria-label="Opakovania ${esc(x.name)} séria ${si+1}" type="number" inputmode="numeric" step="1" min="0" value="${esc(s.reps)}" oninput="setVal(${xi},${si},'reps',this.value)">`}<input aria-label="RIR ${esc(x.name)} séria ${si+1}" type="number" inputmode="numeric" step="1" min="0" max="10" value="${esc(s.rir)}" oninput="setVal(${xi},${si},'rir',this.value)"><button class="done ${s.done?'checked':''}" onclick="toggleDone(${xi},${si},this)">✓</button></div>`).join('')}`}
function exerciseHTML(x,xi){const base=PLANS[draft.planKey].exercises.find(b=>b.id===x.originalId),ex={...base,id:x.exerciseId,name:x.name,measure:x.measure};return`<article class="card exercise"><div class="exercise-head row between"><div class="grow"><h3>${esc(x.name)} ${x.superset?`<span class="superset">SUPERSET ${x.superset}</span>`:''}</h3><div class="exercise-meta">${x.measure==='time'?'Časová výdrž':esc(x.target)} • ${esc(restFor(x))}</div><div class="measure-control"><span>Meranie</span><select aria-label="Spôsob merania ${esc(x.name)}" onchange="setMeasure(${xi},this.value)">${measureOptions(x.measure)}</select></div></div><button class="btn small" onclick="openSwap(${xi})">Vymeniť</button></div><div class="recommend">${esc(recommendation(ex))}</div>${setRowsHTML(x,xi)}<div class="exercise-actions wrap"><button class="btn small" onclick="addSet(${xi})">+ séria</button><button class="btn small danger" onclick="removeSet(${xi})" ${x.sets.length<=(x.plannedSets||0)?'disabled':''}>− séria</button><span class="tiny muted">Minule: ${lastSummary(x.exerciseId)}</span></div></article>`}
function selectPlan(k){state.selectedPlan=k;save();renderToday()}
function setMeasure(x,mode){const ex=draft.exercises[x];ex.measure=mode;state.measureModes[ex.exerciseId]=mode;save();renderToday()}
function setVal(x,s,k,v){draft.exercises[x].sets[s][k]=v}
function toggleDone(x,s,el){draft.exercises[x].sets[s].done=!draft.exercises[x].sets[s].done;el.classList.toggle('checked')}
function addSet(x){draft.exercises[x].sets.push(normalizeSet());renderToday()}
function removeSet(x){const ex=draft.exercises[x],minimum=ex.plannedSets||0;if(ex.sets.length<=minimum){toast('Plánované série sa nedajú odobrať');return}const last=ex.sets[ex.sets.length-1],hasData=last.weight!==''||last.reps!==''||last.seconds!==''||last.rir!==''||last.done;if(hasData&&!confirm('Posledná pridaná séria obsahuje údaje. Naozaj ju odobrať?'))return;ex.sets.pop();renderToday();toast('Pridaná séria odobratá')}
function lastSummary(id){const l=lastFor(id);if(!l)return'—';const mode=l.measure||inferMeasure(l);return l.sets.filter(s=>s.done).map(s=>formatSet(s,mode)).join(', ')||'—'}
function cancelDraft(){if(confirm('Zrušiť rozpracovaný tréning?')){draft=null;renderToday()}}
function finishWorkout(){const completed=draft.exercises.some(x=>x.sets.some(s=>s.done));if(!completed&&!confirm('Žiadna séria nie je označená ako hotová. Uložiť aj tak?'))return;draft.finishedAt=new Date().toISOString();state.sessions.push(draft);save();draft=null;toast('Tréning uložený');renderAll();showView('history')}
function openSwap(xi){activeSwap=xi;const x=draft.exercises[xi],base=PLANS[draft.planKey].exercises.find(b=>b.id===x.originalId);document.querySelector('#swapSheet').innerHTML=`<div class="row between"><div><div class="tiny muted">Nahrádzaš</div><h2>${esc(x.name)}</h2></div><button class="btn small" onclick="closeSwap()">Zavrieť</button></div><p class="tiny muted">Vyber podobný pohyb alebo napíš ľubovoľný cvik. Nový cvik dostane vlastnú oddelenú históriu; stará história zostane zachovaná.</p><h3>Návrhy</h3>${base.suggestions.map(n=>`<div class="suggestion"><span>${esc(n)}</span><button class="btn small secondary" onclick="applySwap('${esc(n).replace(/'/g,"\\'")}')">Vybrať</button></div>`).join('')}<h3 style="margin-top:18px">Vlastný cvik</h3><div class="row" style="margin-top:8px"><input id="customSwap" placeholder="Napr. jednoručný landmine press"><button class="btn primary" onclick="customSwap()">Použiť</button></div>${state.replacements[draft.planKey+'|'+x.originalId]?`<button class="btn danger" style="width:100%;margin-top:18px" onclick="restoreOriginal()">Obnoviť pôvodný cvik</button>`:''}`;document.querySelector('#swapModal').classList.add('open')}
function closeSwap(){document.querySelector('#swapModal').classList.remove('open')}
function customSwap(){const n=document.querySelector('#customSwap').value.trim();if(n)applySwap(n)}
function applySwap(name){const x=draft.exercises[activeSwap],key=draft.planKey+'|'+x.originalId,id='swap-'+uid(),measure=defaultMeasure({name});state.replacements[key]={id,name,createdAt:new Date().toISOString()};state.measureModes[id]=measure;save();x.exerciseId=id;x.name=name;x.measure=measure;x.sets=x.sets.map(()=>normalizeSet());closeSwap();renderToday();toast('Cvik vymenený • nová história')}
function restoreOriginal(){const x=draft.exercises[activeSwap],key=draft.planKey+'|'+x.originalId,base=PLANS[draft.planKey].exercises.find(b=>b.id===x.originalId),measure=state.measureModes[base.id]||defaultMeasure(base);delete state.replacements[key];save();x.exerciseId=base.id;x.name=base.name;x.measure=measure;x.plannedSets=base.sets;x.sets=Array.from({length:base.sets},()=>normalizeSet());closeSwap();renderToday();toast('Pôvodný cvik obnovený')}
function renderHistory(){const r=document.querySelector('#history'),items=[...state.sessions].reverse();r.innerHTML=`<h2>História</h2>${items.length?items.map(s=>`<article class="card history-item"><div class="datebox"><b>${new Date(s.date+'T12:00:00').getDate()}</b>${new Date(s.date+'T12:00:00').toLocaleDateString('sk-SK',{month:'short'})}</div><div><h3>${esc(s.planName)}</h3><div class="history-lines">${s.exercises.filter(x=>x.sets.some(v=>v.done)).map(x=>{const mode=x.measure||inferMeasure(x);return`<b>${esc(x.name)}</b> <span class="muted">(${esc(measureLabel(mode))})</span>: ${x.sets.filter(v=>v.done).map(v=>esc(formatSet(v,mode))).join(', ')}`}).join('<br>')}</div>${s.editedAt?'<div class="tiny muted" style="margin-top:6px">Upravené</div>':''}</div><div class="history-actions"><button class="btn small secondary" onclick="openEdit('${s.id}')">Upraviť</button><button class="btn small danger" onclick="deleteSession('${s.id}')">×</button></div></article>`).join(''):`<div class="card empty">Zatiaľ tu nie je uložený tréning.</div>`}`}
function openEdit(id){const source=state.sessions.find(s=>s.id===id);if(!source)return;editDraft=JSON.parse(JSON.stringify(source));editDraft.exercises=(editDraft.exercises||[]).map(x=>({...x,measure:x.measure||inferMeasure(x),sets:(x.sets||[]).map(normalizeSet)}));renderEditor();document.querySelector('#editModal').classList.add('open')}
function closeEdit(){editDraft=null;document.querySelector('#editModal').classList.remove('open')}
function editRowsHTML(x,ei){const simple=x.measure!=='weight',head=x.measure==='time'?'sek.':x.measure==='bodyweight'?'op.':'kg';return`<div class="set-head ${simple?'simple':''}"><span>#</span><span>${head}</span>${simple?'':'<span>op.</span>'}<span>RIR</span><span>✓</span></div>${x.sets.map((s,si)=>`<div class="set-row ${simple?'simple':''}"><b>${si+1}</b>${x.measure==='time'?`<input aria-label="Edit sekundy ${esc(x.name)} séria ${si+1}" type="number" inputmode="numeric" min="0" value="${esc(s.seconds)}" oninput="editVal(${ei},${si},'seconds',this.value)">`:x.measure==='bodyweight'?`<input aria-label="Edit opakovania ${esc(x.name)} séria ${si+1}" type="number" inputmode="numeric" min="0" value="${esc(s.reps)}" oninput="editVal(${ei},${si},'reps',this.value)">`:`<input aria-label="Edit váha ${esc(x.name)} séria ${si+1}" type="number" inputmode="decimal" step="0.25" min="0" value="${esc(s.weight)}" oninput="editVal(${ei},${si},'weight',this.value)"><input aria-label="Edit opakovania ${esc(x.name)} séria ${si+1}" type="number" inputmode="numeric" min="0" value="${esc(s.reps)}" oninput="editVal(${ei},${si},'reps',this.value)">`}<input aria-label="Edit RIR ${esc(x.name)} séria ${si+1}" type="number" inputmode="numeric" min="0" max="10" value="${esc(s.rir)}" oninput="editVal(${ei},${si},'rir',this.value)"><button class="done ${s.done?'checked':''}" onclick="editToggle(${ei},${si},this)">✓</button></div>`).join('')}`}
function editExerciseHTML(x,ei){return`<div class="edit-exercise"><div class="edit-exercise-head"><h3>${esc(x.name)}</h3><div class="measure-control"><span>Meranie</span><select aria-label="Edit spôsob merania ${esc(x.name)}" onchange="editSetMeasure(${ei},this.value)">${measureOptions(x.measure)}</select></div></div>${editRowsHTML(x,ei)}<div class="edit-set-actions"><button class="btn small" onclick="editAddSet(${ei})">+ séria</button><button class="btn small danger" onclick="editRemoveSet(${ei})" ${x.sets.length<=1?'disabled':''}>− séria</button></div></div>`}
function renderEditor(){if(!editDraft)return;document.querySelector('#editSheet').innerHTML=`<div class="row between"><div><div class="tiny muted">${esc(editDraft.date)}</div><h2 style="margin:2px 0">Upraviť ${esc(editDraft.planName)}</h2></div><button class="btn small" onclick="closeEdit()">Zrušiť</button></div><div class="notice">Upravuješ pôvodný tréning. Po uložení sa nevytvorí duplikát a grafy sa prepočítajú.</div>${editDraft.exercises.map((x,i)=>editExerciseHTML(x,i)).join('')}<button class="btn primary" style="width:100%;margin-top:14px" onclick="saveEdit()">Uložiť zmeny</button>`}
function editSetMeasure(ei,mode){editDraft.exercises[ei].measure=mode;renderEditor()}
function editVal(ei,si,key,value){editDraft.exercises[ei].sets[si][key]=value}
function editToggle(ei,si,el){const s=editDraft.exercises[ei].sets[si];s.done=!s.done;el.classList.toggle('checked')}
function editAddSet(ei){editDraft.exercises[ei].sets.push(normalizeSet({done:true}));renderEditor()}
function editRemoveSet(ei){const sets=editDraft.exercises[ei].sets;if(sets.length<=1)return;const last=sets[sets.length-1],hasData=last.weight!==''||last.reps!==''||last.seconds!==''||last.rir!==''||last.done;if(hasData&&!confirm('Posledná séria obsahuje údaje. Naozaj ju odstrániť?'))return;sets.pop();renderEditor()}
function saveEdit(){if(!editDraft)return;const i=state.sessions.findIndex(s=>s.id===editDraft.id);if(i<0)return;editDraft.editedAt=new Date().toISOString();editDraft.exercises.forEach(x=>{x.sets=x.sets.map(normalizeSet);state.measureModes[x.exerciseId]=x.measure});state.sessions[i]=editDraft;save();closeEdit();renderAll();toast('Tréning upravený a grafy prepočítané')}
function deleteSession(id){if(confirm('Odstrániť tento tréning?')){state.sessions=state.sessions.filter(s=>s.id!==id);save();renderAll()}}
function allExerciseNames(){const m=new Map;Object.entries(PLANS).forEach(([pk,p])=>p.exercises.forEach(b=>{const x=actualExercise(pk,b);m.set(x.id,x.name)}));state.sessions.forEach(s=>s.exercises.forEach(x=>m.set(x.exerciseId,x.name)));return [...m]}
function modeForExercise(id){for(const s of [...state.sessions].reverse()){const x=s.exercises.find(e=>e.exerciseId===id);if(x)return x.measure||inferMeasure(x)}for(const [pk,p] of Object.entries(PLANS)){for(const b of p.exercises){const x=actualExercise(pk,b);if(x.id===id)return state.measureModes[id]||defaultMeasure(x)}}return'weight'}
function metricInfo(mode){return mode==='time'?{label:'najdlhší čas',unit:'s',caption:'Graf zobrazuje najdlhšiu dokončenú výdrž v sekundách.'}:mode==='bodyweight'?{label:'maximum opakovaní',unit:'op.',caption:'Graf zobrazuje najvyšší počet opakovaní s vlastnou váhou.'}:{label:'odhad 1RM',unit:'kg',caption:'Graf zobrazuje najvyšší odhad 1RM z dokončených sérií (Epleyho vzorec).'}}
function renderCharts(){const list=allExerciseNames(),r=document.querySelector('#charts');r.innerHTML=`<h2>Vývoj</h2><div class="card"><label>Cvik<select id="chartExercise" onchange="drawChart(this.value)">${list.map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join('')}</select></label><div class="chart-wrap"><canvas id="progressChart"></canvas></div><div id="chartCaption" class="tiny muted"></div></div>`;requestAnimationFrame(()=>drawChart(list.length?list[0][0]:null))}
function drawChart(id){const c=document.querySelector('#progressChart');if(!c)return;const mode=modeForExercise(id),info=metricInfo(mode),caption=document.querySelector('#chartCaption');if(caption)caption.textContent=info.caption;const dpr=devicePixelRatio||1,rect=c.getBoundingClientRect();c.width=rect.width*dpr;c.height=rect.height*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);const pts=state.sessions.map(s=>{const x=s.exercises.find(e=>e.exerciseId===id);if(!x||(x.measure||inferMeasure(x))!==mode)return null;const done=x.sets.filter(v=>v.done);let vals;if(mode==='time')vals=done.map(v=>Number(v.seconds)).filter(v=>v>0);else if(mode==='bodyweight')vals=done.map(v=>Number(v.reps)).filter(v=>v>0);else vals=done.filter(v=>Number(v.weight)>0&&Number(v.reps)>0).map(v=>Number(v.weight)*(1+Number(v.reps)/30));return vals.length?{date:s.date,v:Math.max(...vals)}:null}).filter(Boolean);ctx.clearRect(0,0,rect.width,rect.height);ctx.strokeStyle='#2c3858';ctx.fillStyle='#9da9c7';ctx.font='11px system-ui';for(let i=0;i<4;i++){const y=20+i*(rect.height-45)/3;ctx.beginPath();ctx.moveTo(38,y);ctx.lineTo(rect.width-8,y);ctx.stroke()}if(!pts.length){ctx.fillText(`Zatiaľ nie sú dáta pre ${info.label}.`,20,rect.height/2);return}const min=Math.min(...pts.map(p=>p.v))*.95,max=Math.max(...pts.map(p=>p.v))*1.05||1,xy=pts.map((p,i)=>({x:42+(pts.length===1 ? .5 : i/(pts.length-1))*(rect.width-60),y:20+(max-p.v)/(max-min||1)*(rect.height-45),...p}));ctx.strokeStyle='#75e1ad';ctx.lineWidth=3;ctx.beginPath();xy.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.fillStyle='#75e1ad';xy.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()});ctx.fillStyle='#9da9c7';ctx.fillText(fmt(max)+' '+info.unit,2,24);ctx.fillText(fmt(min)+' '+info.unit,2,rect.height-22)}
function renderData(){document.querySelector('#data').innerHTML=`<h2>Dáta a nastavenia</h2><div class="card stack"><h3>Záloha</h3><p class="tiny muted" style="margin:0">Export obsahuje tréningy, výmeny cvikov aj začiatok cyklu. Import zlúči alebo nahradí aktuálne dáta.</p><button class="btn secondary" onclick="exportJSON()">Stiahnuť JSON zálohu</button><label class="btn" style="display:block;text-align:center;color:var(--ink)">Importovať JSON<input id="importFile" type="file" accept="application/json" hidden onchange="importJSON(this.files[0])"></label></div><div class="card stack"><h3>Periodizácia</h3><label>Začiatok 4-týždňového cyklu<input type="date" value="${esc(state.cycleStart)}" onchange="state.cycleStart=this.value;save();renderAll()"></label><div class="notice">Týždeň 1 základ • 2 budovanie • 3 intenzita • 4 deload. Odporúčania používajú dokončené série posledného tréningu daného cviku.</div></div><div class="card"><h3>Offline režim</h3><p class="tiny muted">Po prvom načítaní cez HTTPS funguje appka aj bez internetu. Dáta zostávajú iba v tomto prehliadači, preto si pravidelne sťahuj JSON zálohu.</p></div>`}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gym-progress-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href)}
async function importJSON(file){if(!file)return;try{const raw=JSON.parse(await file.text()),x=Array.isArray(raw.sessions)?normalizeState(raw):raw.sessions&&raw.exercises?normalizeState(migrateV4(raw)):null;if(!x)throw Error();const replace=confirm('OK = nahradiť všetky dáta. Zrušiť = zlúčiť tréningy.');if(replace)state=x;else{const ids=new Set(state.sessions.map(s=>s.id));state.sessions.push(...x.sessions.filter(s=>!ids.has(s.id)));state.replacements={...state.replacements,...x.replacements};state.measureModes={...state.measureModes,...x.measureModes}}save();renderAll();toast('Dáta importované')}catch{alert('Súbor nie je platná Gym Progress záloha.')}}
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));if(id==='charts')renderCharts()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showView(b.dataset.view));document.querySelector('#swapModal').onclick=e=>{if(e.target.id==='swapModal')closeSwap()};document.querySelector('#editModal').onclick=e=>{if(e.target.id==='editModal')closeEdit()};
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function renderAll(){renderToday();renderHistory();renderCharts();renderData()}renderAll();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body>
</html>
